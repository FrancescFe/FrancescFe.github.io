<svg xmlns="http://www.w3.org/2000/svg" width="662" height="530" viewBox="0 0 662 530" role="img" aria-labelledby="title description">
  <title id="title">Administrator use case diagram</title>
  <desc id="description">Admin can log in and use the Authors, Books, and Collections areas. The CRUD operations group contains Create, Read by ID, Read All, Update, and Delete.</desc>
  <defs>
