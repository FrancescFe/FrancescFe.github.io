      <path d="M1 1 7 4 1 7" fill="none" stroke="#d2d2d2" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"/>
    </marker>
    <symbol id="user-icon" viewBox="0 0 24 24">
      <circle cx="12" cy="7" r="3.2"/>
      <path d="M5.2 20c.6-4.2 3-6.4 6.8-6.4s6.2 2.2 6.8 6.4"/>
    </symbol>
    <symbol id="login-icon" viewBox="0 0 24 24">
      <path d="M10 4H5v16h5M12 12H3m6-4-4 4 4 4m4-11h6v14h-6"/>
    </symbol>
    <symbol id="people-icon" viewBox="0 0 24 24">
      <circle cx="9" cy="8" r="3"/>
