    </symbol>
    <symbol id="gear-icon" viewBox="0 0 24 24">
      <path d="M10 2h4l.6 2.3a8 8 0 0 1 1.8.8l2.1-1.1 2.8 2.8-1.1 2.1a8 8 0 0 1 .8 1.8l2.3.6v4l-2.3.6a8 8 0 0 1-.8 1.8l1.1 2.1-2.8 2.8-2.1-1.1a8 8 0 0 1-1.8.8L14 23h-4l-.6-2.3a8 8 0 0 1-1.8-.8l-2.1 1.1-2.8-2.8 1.1-2.1a8 8 0 0 1-.8-1.8L1 13.7v-4l2.3-.6a8 8 0 0 1 .8-1.8L3 5.2l2.8-2.8 2.1 1.1a8 8 0 0 1 1.8-.8z"/>
